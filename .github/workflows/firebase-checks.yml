name: Firebase backend checks
on:
  push:
    branches: [main, firebase-migration]
    paths: ['firebase/**', 'firebase.json', '.github/workflows/firebase-checks.yml']
  pull_request:
    paths: ['firebase/**', 'firebase.json', '.github/workflows/firebase-checks.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check index.js
