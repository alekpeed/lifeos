# Deploys the two-way Telegram webhook and the scheduled digest (D-5 phase 1) to
# Supabase, and registers the webhook with Telegram -- no local terminal. Kept
# separate from the push workflow so a missing Telegram secret can't break push
# deploys. Both functions use the same bot, so they share this workflow's secret.
#
# One-time setup (GitHub -> repo Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN       (your bot token from @BotFather -- the same one in
#                             the app's Settings > Telegram)
#   TELEGRAM_WEBHOOK_SECRET  (a random string; generated for you -- see runbook)
#   SUPABASE_ACCESS_TOKEN    (already added for the push workflow)
name: Deploy Telegram Functions

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/functions/telegram-webhook/**'
      - 'supabase/functions/telegram-digest/**'
      - '.github/workflows/deploy-telegram.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ukqdbxxhxxafbcnkmskg
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push function secrets (Telegram)
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            TELEGRAM_WEBHOOK_SECRET="${{ secrets.TELEGRAM_WEBHOOK_SECRET }}"

      # The digest mirrors six Kotlin data shapes with no compiler holding the two
      # sides together. If a field is renamed there, the digest silently goes empty —
      # so the shape tests gate the deploy rather than the deploy gating nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the digest's data shapes
        run: node --experimental-strip-types --test supabase/functions/telegram-digest/digest.test.mjs

      - name: Deploy telegram-webhook
        run: supabase functions deploy telegram-webhook --no-verify-jwt --project-ref "$PROJECT_REF"

      # The digest keeps its JWT check: pg_cron calls it with the anon key, so unlike
      # the webhook (which Telegram calls and authenticates with its own secret header)
      # there is no reason to open it up.
      - name: Deploy telegram-digest
        run: supabase functions deploy telegram-digest --project-ref "$PROJECT_REF"

      - name: Register the webhook with Telegram
        run: |
          curl -sS --fail "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -d "url=https://$PROJECT_REF.supabase.co/functions/v1/telegram-webhook" \
            -d "secret_token=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" \
            -d "allowed_updates=[\"message\"]"
