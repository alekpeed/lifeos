name: Build Native App

# Real native Life OS — Kotlin + Compose Multiplatform. One codebase builds a
# native Android APK, a native Windows desktop app, and a Linux .deb (no WebView).
# Built entirely in the cloud, no local machine — same as the rest of the project.
#
# The .deb is the same binary as Windows; it installs two launchers, the full app
# and the helper window (`lifeos --helper`), so one build serves both.

on:
  push:
    branches: [claude/lifeos-dev-setup-dpipr6, main]
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

jobs:
  android:
    name: Native Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build native Android APK
        working-directory: native
        env:
          # Baked into the APK at build time so the app ships working without each
          # user pasting a key. Stored as a repo secret — never in source. Absent
          # (empty) on forks/PRs, where the app falls back to a user-entered key.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # This workflow's own run number — a plain integer that goes up by one
          # every run, which build.gradle.kts turns into a real versionCode /
          # versionName / packageVersion instead of a hand-set constant that never
          # changes. Same value on all three jobs since they're one workflow run.
          LIFEOS_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-native-android
          path: native/composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Native Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Package native Windows app (.msi)
        working-directory: native
        env:
          LIFEOS_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :composeApp:packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-native-windows
          path: native/composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  linux:
    name: Native Linux App
    # Built on the OLDEST supported base on purpose. jpackage writes the runner's own
    # library names into the package's dependency list, and 24.04 names them with the
    # 64-bit time_t suffix (libasound2t64, libpng16-16t64). Those package names don't
    # exist on 22.04 or on Mint 21.x, so a .deb built on 24.04 refuses to install
    # there. Building on 22.04 produces a package that installs on 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # jpackage builds the .deb; fakeroot and dpkg-dev are what it shells out to.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev binutils

      - name: Package native Linux app (.deb)
        working-directory: native
        env:
          LIFEOS_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :composeApp:packageDeb --no-daemon --stacktrace

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-native-linux
          path: native/composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
